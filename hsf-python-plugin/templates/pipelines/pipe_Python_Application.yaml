pipeline:
  identifier: ${PIPELINE_IDENTIFIER}
  name: ${PIPELINE_NAME}
  orgIdentifier: ${ORGANIZATION_ID}
  projectIdentifier: ${PROJECT_ID}
  description: ${PIPELINE_DESCRIPTION}
  tags:
    ${indent(4, TAGS)}
  properties:
    ci:
      codebase:
        repoName: ${REPOSITORY_NAME}
        build: <+input>
        sparseCheckout: []
        fetchTags: true
  stages:
    - stage:
        name: SAST Scans
        identifier: SAST_Scans
        template:
          templateRef: account.sta_STO_SAST_SCA_Primer
          versionLabel: v2
          templateInputs:
            type: SecurityTests
            variables:
              - name: SCAN_TARGET
                type: String
                value: <+pipeline.properties.ci.codebase.repoName>
              - name: SCAN_VARIANT
                type: String
                value: <+<+codebase.build.type>=="PR" ?<+codebase.targetBranch> :<+codebase.build.type>=="tag" ?<+codebase.tag> :<+codebase.branch>>
              - name: SHARED_ARTIFACTS
                type: String
                value: /shared/customer_artifacts
              - name: GITLEAKS_CPU
                type: String
                value: "0.4"
              - name: GITLEAKS_MEM
                type: String
                value: 600Mi
              - name: OSV_CPU
                type: String
                value: "1"
              - name: OSV_MEM
                type: String
                value: 2Gi
              - name: OWASP_CPU
                type: String
                value: "2"
              - name: OWASP_MEM
                type: String
                value: 6Gi
              - name: SEMGREP_CPU
                type: String
                value: "2"
              - name: SEMGREP_MEM
                type: String
                value: 4Gi
    - stage:
        name: Build
        identifier: Build
        template:
          templateRef: Python_Application_Build_with_Container_Image
          versionLabel: v2
          templateInputs:
            type: CI
            variables:
              - name: PYTHON_BASE_IMAGE
                type: String
                value: dockerhub/python:3.14.7-alpine
              - name: PACKAGE_NAME
                type: String
                value: ${REPOSITORY_NAME}
              - name: PYTHON_MODULE_NAME
                type: String
                value: <+<+stage.variables.PACKAGE_NAME>.replace("-","_")>
              - name: DOCKER_SCAN_REPOSITORY
                type: String
                value: hsf_sandbox/${REPOSITORY_NAME}
              - name: DOCKER_PUBLISH_REPOSITORY
                type: String
                value: ${REGISTRY_NAME}/${REPOSITORY_NAME}
