trigger:
  identifier: ${TRIGGER_IDENTIFIER}
  name: ${TRIGGER_NAME}
  orgIdentifier: ${ORGANIZATION_ID}
  projectIdentifier: ${PROJECT_ID}
  pipelineIdentifier: ${PIPELINE_IDENTIFIER}
  description: "${DESCRIPTION}"
  tags:
    ${indent(4, TAGS)}
  enabled: true
  stagesToExecute: []
  source:
    type: Webhook
    spec:
      type: Harness
      spec:
        type: Branch
        spec:
          autoAbortPreviousExecutions: false
          payloadConditions:
            - key: targetBranch
              operator: NotEquals
              value: main
          headerConditions: []
          repoName: ${REPOSITORY_NAME}
          actions:
            - Create
  inputYaml: |
    pipeline:
      identifier: ${PIPELINE_IDENTIFIER}
      properties:
        ci:
          codebase:
            build:
              type: branch
              spec:
                branch: <+trigger.branch>
