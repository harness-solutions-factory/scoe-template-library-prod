---
# IDP Manager Registration File
# -------
# The Entities List contains a reference to every template in this repository that should have its local HSF IDP Workflow Registered.
# -------
annotations:
  # Annotations and tags added to the IDP Workflows.
  source: harness-template-library
  created_by: Harness
entities:
  # Optional Scoping Keys . Note: without these, the workflow will be registered to the Account-level
  # org: Workflows listed will be registered to the specific Organization. Must exist before registration
  # project: Workflows listed will be registered to the specific Project. Requires an `org`. Must exist before registration
  - workflows: []
      # - name: my_template
      #   modules: # Optional module restriction setting `ci` or `[ci,cd]``
      #   is_default: false # When `false` this Workflow will not be installed except through direct import.
