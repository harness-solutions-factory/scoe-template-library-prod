template:
  identifier: ${TEMPLATE_IDENTIFIER}
  name: ${TEMPLATE_NAME}
  %{~ if ORGANIZATION_ID != null ~}
  orgIdentifier: ${ORGANIZATION_ID}
  %{~ endif ~}
  %{~ if PROJECT_ID != null ~}
  projectIdentifier: ${PROJECT_ID}
  %{~ endif ~}
  description: ${TEMPLATE_DESC}
  versionLabel: ${TEMPLATE_VERSION}
  tags:
    ${indent(4, TAGS)}
  icon: data:image/svg+xml;base64,
  type: StepGroup
  spec:
    stageType: CI
    steps:
      - step:
          type: Run
          name: Generate Dockerfile Baseline Labels and Variables
          identifier: Generate_Dockerfile_Baseline_Labels_and_Variables
          spec:
            shell: Sh
            command: export BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            outputVariables:
              - name: BUILD_DATE
                type: String
                value: BUILD_DATE
              - name: PUBLISH_TAG
                type: String
                value: PUBLISH_TAG
            envVariables:
              RELEASE_TAG: <+stepGroup.variables.RELEASE_TAG>
              SCAN_VARIANT: <+stepGroup.variables.SCAN_VARIANT>
              PUBLISH_TAG: <+stepGroup.variables.PUBLISH_TAG>
      - step:
          type: BuildAndPushDockerRegistry
          name: Build Docker Image
          identifier: Build_Docker_Image
          spec:
            repo: <+stepGroup.variables.SCAN_REPOSITORY>
            tags:
              - <+stepGroup.variables.SCAN_VARIANT>
            caching: true
            dockerfile: <+stepGroup.variables.FMT_DOCKERFILE>
            buildArgs:
              PACKAGE_WHL: <+stepGroup.variables.PACKAGE_WHL>
              PIP_CACHE_DIR: <+stepGroup.variables.PIP_CACHE_DIR>
              RELEASE_VERSION: <+stepGroup.variables.SCAN_VARIANT>
              RELEASE_SHA: <+codebase.commitSha>
              RELEASE_DATE: <+stepGroup.steps.Generate_Dockerfile_Baseline_Labels_and_Variables.output.outputVariables.BUILD_DATE>
            optimize: true
            envVariables:
              PLUGIN_NO_PUSH: "true"
              PLUGIN_BUILDX_LOAD: "true"
              PLUGIN_TAR_PATH: /harness/image_amd64.tar
              PLUGIN_PLATFORM: linux/amd64
            registryRef: account.scoe_images
      - step:
          type: Grype
          name: Scan Snapshot Image
          identifier: Scan_Snapshot_Image
          spec:
            mode: orchestration
            config: default
            target:
              type: container
              workspace: <+stepGroup.steps.Build_Docker_Image.spec.envVariables.PLUGIN_TAR_PATH>
              detection: auto
            advanced:
              log:
                level: info
            resources:
              limits:
                memory: 6Gi
                cpu: "2"
            privileged: true
            image:
              type: local_archive
              tag: <+stepGroup.steps.Build_Docker_Image.artifact_Build_and_Scan_Image_Build_Docker_Image.stepArtifacts.publishedImageArtifacts[0].tag>
              name: <+stepGroup.steps.Build_Docker_Image.artifact_Build_and_Scan_Image_Build_Docker_Image.stepArtifacts.publishedImageArtifacts[0].imageName>
      - step:
          type: BuildAndPushDockerRegistry
          identifier: Push_to_Registry
          name: Push Scanned Image to Registry
          spec:
            repo: <+stepGroup.variables.PUBLISH_REPOSITORY>
            tags: <+stepGroup.steps.Generate_Dockerfile_Baseline_Labels_and_Variables.output.outputVariables.PUBLISH_TAG.split(',')>
            caching: true
            dockerfile: <+stepGroup.variables.FMT_DOCKERFILE>
            buildArgs:
              PACKAGE_WHL: <+stepGroup.variables.PACKAGE_WHL>
              PIP_CACHE_DIR: <+stepGroup.variables.PIP_CACHE_DIR>
              RELEASE_VERSION: <+stepGroup.variables.SCAN_VARIANT>
              RELEASE_SHA: <+codebase.commitSha>
              RELEASE_DATE: <+stepGroup.steps.Generate_Dockerfile_Baseline_Labels_and_Variables.output.outputVariables.BUILD_DATE>
            optimize: true
            envVariables:
              PLUGIN_PLATFORM: linux/amd64,linux/arm64
            registryRef: account.scoe_images
          when:
            stageStatus: Success
            condition: <+!empty(<+stepGroup.variables.RELEASE_TAG>)>
    variables:
      - name: RELEASE_TAG
        type: String
        value: <+input>
        description: Container image Tag
        required: true
      - name: SCAN_REPOSITORY
        type: String
        value: <+input>
        description: The name of the repo. Use the format <hub-user>/<repo-name>.
        required: true
      - name: SCAN_VARIANT
        type: String
        value: <+input>
        description: Container image version used for scans
        required: true
      - name: PUBLISH_REPOSITORY
        type: String
        value: <+input>
        description: The name of the repo. Use the format <hub-user>/<repo-name>.
        required: true
      - name: PUBLISH_TAG
        type: String
        value: <+input>
        description: Container image Tag
        required: true
      - name: DOCKERFILE
        type: String
        value: <+input>
        description: Custom Dockerfile Name and Path. If not provided, then will use the default value of 'Dockerfile'
        required: false
      - name: FMT_DOCKERFILE
        type: String
        value: <+!empty(<+stepGroup.variables.DOCKERFILE>) ?<+stepGroup.variables.DOCKERFILE> :"Dockerfile">
        description: Custom Dockerfile Name and Path. If not provided, then will use the default value of 'Dockerfile'
        required: true
      - name: PACKAGE_WHL
        type: String
        value: <+input>
        description: Container image Tag
        required: true
      - name: PIP_CACHE_DIR
        type: String
        value: <+input>
        description: Default Pip Cache Location
        required: true
