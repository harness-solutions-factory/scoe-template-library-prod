template:
  identifier: ${TEMPLATE_IDENTIFIER}
  name: ${TEMPLATE_NAME}
  %{~ if ORGANIZATION_ID != null ~}
  orgIdentifier: ${ORGANIZATION_ID}
  %{~ endif ~}
  %{~ if PROJECT_ID != null ~}
  projectIdentifier: ${PROJECT_ID}
  %{~ endif ~}
  description: ${TEMPLATE_DESC}
  versionLabel: ${TEMPLATE_VERSION}
  tags:
    ${indent(4, TAGS)}
  icon: data:image/png;base64,
  type: StepGroup
  spec:
    stageType: CI
    steps:
      - step:
          type: Run
          name: Build Artifact
          identifier: Build_Artifact
          spec:
            registryRef: account.scoe_images
            image: <+input>
            shell: Sh
            command: |-
              python -m pip install ".[publish]"
              python -m build
              export PACKAGE_WHL=`ls dist/*.whl`
              pip freeze | grep -v $${APP_MODULE_NAME} > requirements.pip
              cat requirements.pip
            envVariables:
              APP_MODULE_NAME: <+<+stepGroup.variables.FMT_APP_MODULE_NAME>.replace("_","-").replaceAll("/+$", "")>
            outputVariables:
              - name: PACKAGE_WHL
        contextType: StepGroupTemplate
      - step:
          type: Test
          name: Unit Tests
          identifier: Unit_Tests
          spec:
            registryRef: account.scoe_images
            image: <+input>
            shell: Sh
            command: |-
              echo "Install Dependencies"
              python -m pip install --constraint requirements.pip "$${PACKAGE_WHL}[dev]"
              echo "Run Unit Tests"
              python -m pytest tests/
            envVariables:
              APP_MODULE_NAME: <+stepGroup.variables.FMT_APP_MODULE_NAME>
              PACKAGE_WHL: <+stepGroup.steps.Build_Artifact.output.outputVariables.PACKAGE_WHL>
            intelligenceMode: true
      - step:
          type: Run
          name: Lint Checks
          identifier: Lint_Checks
          spec:
            registryRef: account.scoe_images
            image: <+input>
            shell: Sh
            command: |-
              echo "Install Dependencies"
              python -m pip install --constraint requirements.pip "$${PACKAGE_WHL}[dev]"
              echo "Run mypy static type checking over the source"
              python -m mypy src/$${APP_MODULE_NAME}
              echo "Lint docstrings"
              python -m ruff check --select D src/$${APP_MODULE_NAME}
              echo "Pytest docstrings"
              python -m pytest tests/test_docstrings.py --doctest-modules src/$${APP_MODULE_NAME} -v
            envVariables:
              APP_MODULE_NAME: <+stepGroup.variables.FMT_APP_MODULE_NAME>
              PACKAGE_WHL: <+stepGroup.steps.Build_Artifact.output.outputVariables.PACKAGE_WHL>
    variables:
      - name: APP_MODULE_NAME
        type: String
        value: <+input>
        description: ""
        required: false
      - name: FMT_APP_MODULE_NAME
        type: String
        description: Optional working-directory prefix with trailing slash
        required: false
        value: <+!empty(<+stepGroup.variables.APP_MODULE_NAME>) ?'<+stepGroup.variables.APP_MODULE_NAME.replaceAll("/+$", "")>/' :"">
