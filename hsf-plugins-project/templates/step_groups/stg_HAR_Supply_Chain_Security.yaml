template:
  identifier: ${TEMPLATE_IDENTIFIER}
  name: ${TEMPLATE_NAME}
  %{~ if ORGANIZATION_ID != null ~}
  orgIdentifier: ${ORGANIZATION_ID}
  %{~ endif ~}
  %{~ if PROJECT_ID != null ~}
  projectIdentifier: ${PROJECT_ID}
  %{~ endif ~}
  description: ${TEMPLATE_DESC}
  versionLabel: ${TEMPLATE_VERSION}
  tags:
    ${indent(4, TAGS)}
  icon: data:image/svg+xml;base64,
  type: StepGroup
  spec:
    stageType: CI
    steps:
      - step:
          identifier: SBOM_Orchestration
          type: SscaOrchestration
          name: SBOM Orchestration
          spec:
            mode: generation
            tool:
              type: Syft
              spec:
                format: spdx-json
            source:
              type: har
              spec:
                registry: account.scoe_images
                image: <+stepGroup.variables.DOCKER_REPOSITORY>:<+stepGroup.variables.RELEASE_TAG>
            sbom_drift:
              base: last_generated_sbom
            resources:
              limits:
                memory: 2GI
                cpu: "1"
      - step:
          identifier: SLSA_Generation
          type: provenance
          name: SLSA Generation
          spec:
            source:
              type: har
              spec:
                registry: account.scoe_images
                image: <+stepGroup.variables.DOCKER_REPOSITORY>:<+stepGroup.variables.RELEASE_TAG>
            resources:
              limits:
                memory: 500Mi
                cpu: "0.5"
      - step:
          identifier: ArtifactSigning
          type: SscaArtifactSigning
          name: Artifact Signing
          spec:
            source:
              type: har
              spec:
                registry: account.scoe_images
                image: <+stepGroup.variables.DOCKER_REPOSITORY>:<+stepGroup.variables.RELEASE_TAG>
            signing:
              type: keybased
              spec:
                private_key: cosign_key
                password: cosign_password
            resources:
              limits:
                memory: 500Mi
                cpu: "0.5"
      - step:
          identifier: Anchore_Grype
          type: Grype
          name: Anchore Grype
          spec:
            mode: orchestration
            config: default
            target:
              type: container
              detection: auto
            advanced:
              log:
                level: info
              fail_on_severity: none
            resources:
              limits:
                memory: 2G
                cpu: 1000m
            privileged: true
            image:
              type: harness
              tag: <+stepGroup.variables.RELEASE_TAG>
              registry: account.scoe_images
              image_path: <+stepGroup.variables.DOCKER_REPOSITORY>:<+stepGroup.variables.RELEASE_TAG>
              name: <+stepGroup.variables.DOCKER_REPOSITORY>
    variables:
      - name: DOCKER_REPOSITORY
        type: String
        value: <+input>
        description: Specify the repository where the image was pushed
        required: true
      - name: RELEASE_TAG
        type: String
        value: <+input>
        description: Specify the Tag of the built image
        required: false
    when:
      stageStatus: Success
      condition: <+!empty(<+stepGroup.variables.RELEASE_TAG>)>
