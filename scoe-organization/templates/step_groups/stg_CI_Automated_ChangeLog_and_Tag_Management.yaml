template:
  identifier: ${TEMPLATE_IDENTIFIER}
  name: ${TEMPLATE_NAME}
  %{~ if ORGANIZATION_ID != null ~}
  orgIdentifier: ${ORGANIZATION_ID}
  %{~ endif ~}
  description: ${TEMPLATE_DESC}
  versionLabel: ${TEMPLATE_VERSION}
  tags:
    ${indent(4, TAGS)}
  icon: data:image/svg+xml;base64,
  type: StepGroup
  spec:
    stageType: CI
    when: <+input>
    steps:
      - step:
          type: Agent
          name: Changelog Update
          identifier: Changelog_Update
          spec:
            agentName: org.ca_scoe_repository_readiness_evaluation
            agentSettings: {}
        contextType: Pipeline
      - step:
          type: Run
          name: Show the Last Three Commits
          identifier: Show_the_Last_Three_Commits
          spec:
            shell: Sh
            command: |
              git --no-pager log -3
        contextType: Pipeline
      - step:
          type: Run
          name: Show the top 20 lines of the CHANGELOG
          identifier: Show_the_top_20_lines_of_the_CHANGELOG
          spec:
            shell: Sh
            command: head -n 20 CHANGELOG.md
        contextType: Pipeline
      - step:
          type: Run
          name: Generate Output Variables
          identifier: Generate_Output_Variables
          description: This step will present the output variables as the Stage Scope Alias 'ai_documentation'
          spec:
            shell: Sh
            command: |-
              echo "Documenting StepGroup Output Variables..."
              echo "GIT_TAG: $${INPUT_GIT_TAG}"
              export INPUT_GIT_COMMIT_SHA=`git rev-parse --short HEAD~1`
              echo "GIT_COMMIT_SHA: $${INPUT_GIT_COMMIT_SHA}"
            envVariables:
              INPUT_GIT_TAG: <+stepGroup.steps.Changelog_Update.steps.ca_scoe_repository_readiness_evaluation_1.output.outputVariables.GIT_TAG>
            outputVariables:
              - name: GIT_TAG
                type: String
                value: INPUT_GIT_TAG
              - name: GIT_COMMIT_SHA
                type: String
                value: INPUT_GIT_COMMIT_SHA
            outputAlias:
              key: ai_documentation
              scope: Stage
